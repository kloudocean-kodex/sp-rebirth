name: TEMP final staging deployment

on:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: sp-rebirth-final-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify Cloudflare staging and deploy final landing page
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://sp-rebirth-staging.rajputrupali138.workers.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      STAGING_URL: https://sp-rebirth-staging.rajputrupali138.workers.dev

    steps:
      - name: Checkout exact development commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Require protected staging credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "Required Cloudflare staging credentials or Turnstile site key are missing."
            exit 1
          fi
          echo "Protected staging credential references are populated."

      - name: Verify existing Cloudflare staging resources with GET only
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          base = "https://api.cloudflare.com/client/v4"

          def get(path, params=None):
              url = base + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  method="GET",
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if not payload.get("success"):
                  raise SystemExit(f"Cloudflare GET failed for {path}")
              return payload.get("result")

          verify = get("/user/tokens/verify") or {}
          if verify.get("status") != "active":
              raise SystemExit("Cloudflare API token is not active")

          workers = get(f"/accounts/{account}/workers/scripts", {"per_page": 100}) or []
          worker_names = {item.get("id") or item.get("name") for item in workers if isinstance(item, dict)}
          if "sp-rebirth-staging" not in worker_names:
              raise SystemExit("Expected existing Worker sp-rebirth-staging was not found")

          queues_result = get(f"/accounts/{account}/queues", {"per_page": 100}) or []
          if isinstance(queues_result, dict):
              queues_result = queues_result.get("queues") or queues_result.get("result") or []
          queue_names = {
              item.get("queue_name") or item.get("name")
              for item in queues_result
              if isinstance(item, dict)
          }
          required = {"sp-rebirth-staging-leads", "sp-rebirth-staging-leads-dlq"}
          missing = required - queue_names
          if missing:
              raise SystemExit("Missing expected existing staging queue resources: " + ", ".join(sorted(missing)))

          print("Cloudflare token active.")
          print("Existing staging Worker verified: sp-rebirth-staging")
          print("Existing staging Queue verified: sp-rebirth-staging-leads")
          print("Existing staging DLQ verified: sp-rebirth-staging-leads-dlq")
          print("No mutating Cloudflare request was made during inventory.")
          PY

      - name: Deploy exact development build to isolated staging Worker
        run: npm run deploy:staging

      - name: Verify final one-page landing page is live
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error "$STAGING_URL/")"
          printf '%s' "$body" | grep -Fq "Your property should never feel like a mystery."
          printf '%s' "$body" | grep -Fq "No handballing. No wondering who owns the next step."
          printf '%s' "$body" | grep -Fq "Start with the property. Leave with a clearer next step."
          echo "Final REBIRTH one-page landing page markers verified on staging."

      - name: Verify staging remains non-indexable
        shell: bash
        run: |
          robots="$(curl --fail --silent --show-error "$STAGING_URL/robots.txt")"
          printf '%s' "$robots" | grep -Eiq "disallow:[[:space:]]*/"
          headers="$(curl --fail --silent --show-error --head "$STAGING_URL/")"
          printf '%s' "$headers" | grep -Eiq "x-robots-tag:.*noindex"
          echo "Staging robots/noindex contract verified."
