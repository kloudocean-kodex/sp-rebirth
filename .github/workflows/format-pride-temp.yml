name: TEMP format Sana PRIDE page

on:
  push:
    branches:
      - feat/sana-final-feedback-pride-20260906

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/sana-final-feedback-pride-20260906
          fetch-depth: 0
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format only final landing files
        run: npx prettier --write src/pages/index.astro src/styles/home-pride-final.css tests/e2e/site.spec.ts
      - name: Verify formatter scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/pages/index\.astro|src/styles/home-pride-final\.css|tests/e2e/site\.spec\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatter changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if [ -z "$changed" ]; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/styles/home-pride-final.css tests/e2e/site.spec.ts
          git commit -m "style: format final Sana PRIDE landing"
          git push origin HEAD:feat/sana-final-feedback-pride-20260906
