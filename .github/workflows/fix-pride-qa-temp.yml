name: TEMP fix PRIDE QA contracts

on:
  push:
    branches: [feat/sana-final-feedback-pride-20260906]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/sana-final-feedback-pride-20260906

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply remaining root-cause QA corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css = Path('src/styles/home-pride-final.css')
          text = css.read_text()
          text = text.replace(
              '.home-rebirth .rebirth-founder__pride {\n  color: #fffdf8;',
              '.home-rebirth .rebirth-founder__pride {\n  color: #171713;',
              1,
          )
          if '.home-rebirth .rebirth-founder__pride {\n  color: #171713;' not in text:
              raise SystemExit('Accessible founder PRIDE colour not present')
          css.write_text(text)

          unit = Path('tests/site.test.ts')
          text = unit.read_text()
          text = text.replace(
              "expect(header).toContain('src={SITE.logo}');",
              "expect(header).toContain('src={SITE.logoAsset}');\n    expect(SITE.logoAsset).toBe('/media/sana-patel-logo.webp');",
              1,
          )
          if "expect(header).toContain('src={SITE.logoAsset}');" not in text:
              raise SystemExit('Local original-logo unit contract not present')
          unit.write_text(text)

          e2e = Path('tests/e2e/site.spec.ts')
          text = e2e.read_text()
          text = text.replace(
              "await expect(logo).toHaveAttribute('src', /Sana-Patel-Logo\\.webp$/);",
              "await expect(logo).toHaveAttribute('src', /\\/media\\/sana-patel-logo\\.webp$/);",
              1,
          )
          text = text.replace(
              "  await expect(page.getByRole('heading', { name: /trust should not depend on a polished promise/i })).toBeVisible();\n",
              '',
              1,
          )
          text = text.replace(
              "  await expect(page.getByRole('link', { name: /current google reviews open source/i })).toHaveAttribute(\n    'href',\n    /query_place_id=ChIJ56JfW3H5QQcRERAx5fE3MgM/,\n  );\n  await expect(page.getByRole('link', { name: /current agency activity realestate\\.com\\.au/i })).toHaveAttribute(\n    'href',\n    'https://www.realestate.com.au/agency/sana-patel-real-estate-KRFFJV',\n  );\n",
              "  await expect(page.getByRole('link', { name: /read reviews on google/i })).toHaveAttribute(\n    'href',\n    /query_place_id=ChIJ56JfW3H5QQcRERAx5fE3MgM/,\n  );\n",
              1,
          )
          if "/\\/media\\/sana-patel-logo\\.webp$/" not in text:
              raise SystemExit('Local original-logo browser contract not present')
          if 'trust should not depend on a polished promise' in text.lower():
              raise SystemExit('Stale review heading assertion remains')
          if 'read reviews on google' not in text.lower():
              raise SystemExit('Current Google review link assertion missing')
          e2e.write_text(text)
          PY

          npm exec prettier -- --write src/styles/home-pride-final.css tests/site.test.ts tests/e2e/site.spec.ts
          git diff --check

      - name: Commit QA corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/home-pride-final.css tests/site.test.ts tests/e2e/site.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve final PRIDE accessibility and QA contracts'
          git push origin HEAD:feat/sana-final-feedback-pride-20260906
