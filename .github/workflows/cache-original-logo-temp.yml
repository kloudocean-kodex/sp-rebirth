name: TEMP cache original Sana logo

on:
  push:
    branches: [feat/sana-final-feedback-pride-20260906]

permissions:
  contents: write

jobs:
  cache-logo:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/sana-final-feedback-pride-20260906

      - name: Fetch verified original Sana wordmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media
          curl --fail --location --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 45 \
            https://www.sanapatel.com.au/wp-content/uploads/2025/07/Sana-Patel-Logo.webp \
            --output public/media/sana-patel-logo.webp
          test -s public/media/sana-patel-logo.webp
          file public/media/sana-patel-logo.webp | grep -qi 'webp'

      - name: Commit cached brand asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/sana-patel-logo.webp
          git diff --cached --quiet && exit 0
          git commit -m 'assets: self-host original Sana wordmark'
          git push origin HEAD:feat/sana-final-feedback-pride-20260906
