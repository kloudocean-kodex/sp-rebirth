name: SP_REBIRTH CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# TEMPORARY for PR #19 lock refresh only. Returned to contents: read
# immediately after the audited package-lock.json is committed.
permissions:
  contents: write

concurrency:
  group: sp-rebirth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality gates, build and Chromium QA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR head for temporary lock refresh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate patched lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install generated locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=low

      - name: Commit audited generated lockfile to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Generated lockfile already matches the PR branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for lint toolchain"
          git push origin HEAD:${{ github.head_ref }}

      - name: Unit tests
        run: npm test

      - name: Astro typecheck
        run: npm run typecheck

      - name: ESLint static analysis
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Production build
        run: npm run build

      - name: Sanity Studio build
        run: npm run build:studio

      - name: Wrangler deployment bundle dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run --experimental-provision=false --experimental-auto-create=false

      - name: Install Chromium for primary browser QA
        run: npx playwright install --with-deps chromium

      - name: Chromium browser, responsive and accessibility QA
        run: npx playwright test --project=desktop-chromium --project=mobile-chromium

      - name: Upload Chromium QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sp-rebirth-main-browser-qa-${{ github.run_number }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  cross-browser:
    name: Cross-browser QA · ${{ matrix.project }}
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-firefox
            browser: firefox
            workers: 1
          - project: desktop-webkit
            browser: webkit
            workers: 2
          - project: mobile-webkit
            browser: webkit
            workers: 2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate patched lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install generated locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build for browser runtime
        run: npm run build

      - name: Install ${{ matrix.browser }} for compatibility QA
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.project }} functional and accessibility QA
        run: npx playwright test --project=${{ matrix.project }} --workers=${{ matrix.workers }}

      - name: Upload ${{ matrix.project }} QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sp-rebirth-main-${{ matrix.project }}-qa-${{ github.run_number }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
