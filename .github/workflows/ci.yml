name: SP_REBIRTH CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sp-rebirth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile once
        if: github.ref == 'refs/heads/development' && github.event_name == 'push'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock tested npm dependency graph"
            git push origin HEAD:development
          fi

      - name: Unit tests
        run: npm test

      - name: Astro typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
