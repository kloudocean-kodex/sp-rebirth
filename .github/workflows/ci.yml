name: SP_REBIRTH CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sp-rebirth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, typecheck, build and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Astro typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Wrangler deployment bundle dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run --experimental-provision=false --experimental-auto-create=false

      - name: Install browser engines for QA
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser, responsive and accessibility QA
        run: npm run test:e2e

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sp-rebirth-browser-qa-${{ github.run_number }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
