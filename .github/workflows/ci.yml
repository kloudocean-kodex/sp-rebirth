name: SP_REBIRTH CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: sp-rebirth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality gates, build and Chromium QA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=low

      - name: Unit tests
        run: npm test

      - name: Astro typecheck
        run: npm run typecheck

      - name: ESLint static analysis
        run: npm run lint

      - name: Prettier format check
        shell: bash
        run: |
          if ! npm run format:check; then
            npx prettier --write .
            git diff --check
            git diff -- . ':(exclude)package-lock.json'
            exit 1
          fi

      - name: Production build
        run: npm run build

      - name: Sanity Studio build
        run: npm run build:studio

      - name: Wrangler deployment bundle dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run --experimental-provision=false --experimental-auto-create=false

      - name: Install Chromium for primary browser QA
        run: npx playwright install --with-deps chromium

      - name: Chromium browser, responsive and accessibility QA
        run: npx playwright test --project=desktop-chromium --project=mobile-chromium

      - name: Upload Chromium QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sp-rebirth-browser-qa-${{ github.run_number }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  cross-browser:
    name: Cross-browser QA · ${{ matrix.project }}
    needs: build
    # Keep compatibility evidence running when a primary quality gate fails;
    # skip only when the workflow is explicitly cancelled.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-firefox
            browser: firefox
          - project: desktop-webkit
            browser: webkit
          - project: mobile-webkit
            browser: webkit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build for browser runtime
        run: npm run build

      - name: Install ${{ matrix.browser }} for compatibility QA
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.project }} functional and accessibility QA
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload ${{ matrix.project }} QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sp-rebirth-${{ matrix.project }}-qa-${{ github.run_number }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
