name: SP_REBIRTH staging deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sp-rebirth-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated staging Worker
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://sp-rebirth-staging.rajputrupali138.workers.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Require the staging deployment credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "Cloudflare deployment credentials or PUBLIC_TURNSTILE_SITE_KEY are not configured in the staging environment."
            exit 1
          fi

      - name: Deploy staging Worker
        run: npm run deploy:staging
